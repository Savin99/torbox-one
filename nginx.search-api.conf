server {
    listen 80;
    listen [::]:80;
    server_name search.example.org;
    location /.well-known/acme-challenge/ { root /var/www/torbox-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name search.example.org;
    ssl_certificate /etc/letsencrypt/live/search.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/search.example.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / {
        proxy_pass http://127.0.0.1:18787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 100s;
    }
}
