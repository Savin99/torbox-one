services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: torbox-prowlarr
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Moscow
    volumes:
      - ./prowlarr-config:/config
    ports:
      - 127.0.0.1:9696:9696
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
