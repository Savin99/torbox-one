# Файлы репозитория свёрстаны руками: широкие таблицы паттернов и словари
# читаются построчно. `ruff format` по умолчанию разносит их по одному
# элементу на строку, и правка в десять строк выглядит как переезд файла,
# поэтому форматирование выключено, а проверка ошибок — оставлена.
line-length = 120
force-exclude = true

[format]
exclude = ["*.py"]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Логгер настраивается до импорта бота: torbox_tg_bot зовёт basicConfig
# на импорте и иначе перехватил бы конфигурацию uvicorn (док-строка файла).
"search_api.py" = ["E402"]
