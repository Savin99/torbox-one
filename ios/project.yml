name: TorBoxOne
options:
  bundleIdPrefix: com.ilyaqa
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
targets:
  TorBoxOne:
    type: application
    platform: iOS
    sources: [TorBoxOne]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ilyaqa.torboxone
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: TorBoxOne/Info.plist
      properties:
        CFBundleDisplayName: TorBox One
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru, en]
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        LSApplicationQueriesSchemes: [infuse]
        CFBundleURLTypes:
          - CFBundleURLName: com.ilyaqa.torboxone.infuse
            CFBundleURLSchemes: [torboxone]
          - CFBundleURLName: com.ilyaqa.torboxone.magnet
            CFBundleURLSchemes: [magnet]
        NSLocalNetworkUsageDescription: "Подключение к локальному серверу поиска во время разработки."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  TorBoxOneTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TorBoxOneTests]
    dependencies:
      - target: TorBoxOne
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TorBoxOne:
    build:
      targets:
        TorBoxOne: all
    test:
      targets: [TorBoxOneTests]
